name: Backfill Match Stats

on:
  schedule:
    # Runs daily at 09:00 UTC, ~12h offset from the main Pass A pipeline
    # (21:00 UTC). football-data.co.uk publishes final scores immediately
    # but fills in shots/corners/cards/closing odds 1-2 days later. Because
    # the sync merge always lets the freshest fetch overwrite a match's
    # existing row (keyed by Date+HomeTeam+AwayTeam, no duplicates), running
    # this daily lets any still-incomplete match get enriched on the next
    # day(s) it becomes available, without needing exact timing.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Re-sync recent results & rebuild features
        run: |
          python data_tools/download_historical_data.py --sync
          python data_tools/build_features.py

      - name: 2. Commit and push updated data
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated backfill: enriched recent match stats/odds"
            git push origin HEAD:${{ github.ref_name }}
          fi
