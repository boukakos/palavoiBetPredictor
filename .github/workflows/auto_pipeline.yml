name: Auto Betting Pipeline

on:
  schedule:
    # Κάθε Τετάρτη στις 07:00 UTC = 10:00 π.μ. ώρα Ελλάδας
    - cron: '0 7 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests pandas

      - name: 1. Fetch live Stoiximan odds
        run: |
          python fetch_odds.py

      - name: 2. Run live prediction pipeline
        run: |
          python app/live_pipeline.py

      - name: 3. Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ upcoming_fixtures.csv
          git diff --cached --quiet || git commit -m "Automated pipeline update: refreshed Stoiximan odds & live predictions"
          git push origin HEAD:main